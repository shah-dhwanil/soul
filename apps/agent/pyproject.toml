[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.115.0",
    "gradio>=5.0.0",
    "httpx>=0.28.0",
    "graphiti-core[groq]>=0.31.2",
    "langchain>=1.4.9",
    "langchain-cloudflare>=0.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
