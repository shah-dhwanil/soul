[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[project]
name = "soul-api"
version = "0.1.0"
description = "HTTP API for the Soul agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
agent = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a live database",
]
